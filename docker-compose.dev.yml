# Local development helpers: MySQL + LiveKit only. The app runs on the host with `npm run dev`.
#
#   docker compose -f docker-compose.dev.yml up -d
#   export DATABASE_URL=mysql://oficio:oficio@127.0.0.1:3306/oficio   # optional: without it, dev mode keeps data in memory (MYSQL_DEV_PORT=3307 if 3306 is taken)
#   export LIVEKIT_URL=ws://127.0.0.1:7880 LIVEKIT_INTERNAL_URL=http://127.0.0.1:7880 LIVEKIT_API_KEY=devkey LIVEKIT_API_SECRET=devsecretdevsecretdevsecret12345
#   npm run dev            # http://127.0.0.1:4747 — camera/mic work on localhost without HTTPS
#
# Works on Docker Desktop (Windows/macOS) and Linux: LiveKit announces 127.0.0.1, so only this machine can join calls.

name: oficio-dev

services:
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oficio
      MYSQL_USER: oficio
      MYSQL_PASSWORD: oficio
    ports:
      # MYSQL_DEV_PORT lets you avoid a clash with a MySQL already running on the host.
      - "127.0.0.1:${MYSQL_DEV_PORT:-3306}:3306"
    volumes:
      - mysql-dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "devkey: devsecretdevsecretdevsecret12345"
    configs:
      - source: livekit_dev
        target: /etc/livekit.yaml
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"

configs:
  livekit_dev:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        udp_port: 7882
        use_external_ip: false
        node_ip: 127.0.0.1
      room:
        auto_create: true
        empty_timeout: 300
      logging:
        level: info
        pion_level: error

volumes:
  mysql-dev:
