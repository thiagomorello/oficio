# DigitalOcean App Platform spec for Oficio (docs/deploy/digitalocean.md).
# Import with: doctl apps create --spec .do/app.yaml   (or paste in the App Platform UI > "Edit App Spec").
# App Platform has no UDP, so audio/video uses LiveKit Cloud (or a LiveKit on a Droplet). The managed MySQL
# cluster below is created by this spec; the DATABASE_URL is injected automatically from the `db` component.
name: oficio
region: nyc
services:
  - name: app
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: thiagomorello/oficio
      branch: main
      deploy_on_push: false
    http_port: 4747
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
    envs:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: OFFICE_COOKIE_SECURE
        value: "1"
      - key: OFFICE_PUBLIC_URL
        value: ${APP_URL}
      - key: OFFICE_ALLOWED_HOSTS
        value: ${APP_DOMAIN}
      - key: OFFICE_JWT_SECRET
        type: SECRET
        value: REPLACE_WITH_openssl_rand_hex_32
      - key: OFFICE_APP_NAME
        value: Oficio
      - key: OFFICE_DEFAULT_LOCALE
        value: en
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: LIVEKIT_URL
        value: wss://REPLACE.livekit.cloud
      - key: LIVEKIT_INTERNAL_URL
        value: wss://REPLACE.livekit.cloud
      - key: LIVEKIT_API_KEY
        type: SECRET
        value: REPLACE
      - key: LIVEKIT_API_SECRET
        type: SECRET
        value: REPLACE
      - key: LIVEKIT_ROOM
        value: oficio
databases:
  - name: db
    engine: MYSQL
    version: "8"
    production: true
    cluster_name: oficio-db
