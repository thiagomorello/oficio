name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: oficio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name oficio -p 4747:4747 -e OFFICE_IN_MEMORY=1 -e OFFICE_COOKIE_SECURE=0 oficio:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4747/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs oficio
          [ "${ok:-}" = 1 ]
          curl -fsS http://127.0.0.1:4747/api/config | grep -q '"appName"'

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        env:
          OFFICE_DOMAIN: office.example.com
          LIVEKIT_DOMAIN: livekit.example.com
          OFFICE_JWT_SECRET: x
          MYSQL_PASSWORD: x
          MYSQL_ROOT_PASSWORD: x
          LIVEKIT_API_KEY: x
          LIVEKIT_API_SECRET: x
          LIVEKIT_NODE_IP: 203.0.113.1
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f deploy/portainer/stack.yml config -q
          docker compose -f deploy/portainer/stack-swarm.yml config -q
