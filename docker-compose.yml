# Oficio — production stack for a single VPS (Docker Compose v2).
#
#   app      Node 22 (this repo)            https://$OFFICE_DOMAIN   (Caddy -> app:4747)
#   livekit  LiveKit SFU (audio/video)      wss://$LIVEKIT_DOMAIN    (Caddy -> livekit:7880) + 7881/tcp + 7882/udp on the host
#   mysql    MySQL 8                        internal only
#   caddy    reverse proxy + automatic TLS  80/443
#
# Quick start (docs/quickstart.md):
#   cp .env.example .env && ./scripts/gen-secrets.sh      # fills every secret
#   edit .env: OFFICE_DOMAIN, LIVEKIT_DOMAIN, ACME_EMAIL, OFFICE_PUBLIC_URL, OFFICE_ALLOWED_HOSTS, LIVEKIT_URL, LIVEKIT_NODE_IP
#   docker compose up -d
#   ./scripts/first-admin.sh admin@example.com "Your Name"
#
# Firewall: open 80/tcp, 443/tcp, ${LIVEKIT_TCP_PORT:-7881}/tcp and ${LIVEKIT_UDP_PORT:-7882}/udp. DNS A records for both
# domains must point to this host before the first start (Let's Encrypt). Cloudflare: DNS only (grey cloud).
#
# Using LiveKit Cloud instead of the bundled SFU: remove the `livekit` service, set LIVEKIT_URL/LIVEKIT_INTERNAL_URL to
# the wss:// URL of your project and paste its API key/secret. See docs/livekit.md.

name: oficio

services:
  app:
    image: ghcr.io/thiagomorello/oficio:${OFICIO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      OFFICE_IN_DOCKER: "1"
      OFFICE_HOST: 0.0.0.0
      OFFICE_PORT: "4747"
      OFFICE_PUBLIC_URL: ${OFFICE_PUBLIC_URL:-https://${OFFICE_DOMAIN}}
      OFFICE_ALLOWED_HOSTS: ${OFFICE_ALLOWED_HOSTS:-${OFFICE_DOMAIN}}
      OFFICE_COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:?run ./scripts/gen-secrets.sh}
      OFFICE_APP_NAME: ${OFFICE_APP_NAME:-Oficio}
      OFFICE_LOGO_URL: ${OFFICE_LOGO_URL:-}
      OFFICE_ACCENT_COLOR: ${OFFICE_ACCENT_COLOR:-}
      OFFICE_SIGN_TEXT: ${OFFICE_SIGN_TEXT:-}
      OFFICE_DEFAULT_LOCALE: ${OFFICE_DEFAULT_LOCALE:-en}
      # The password must be URL-safe (gen-secrets.sh produces hex).
      DATABASE_URL: mysql://${MYSQL_USER:-oficio}:${MYSQL_PASSWORD:?run ./scripts/gen-secrets.sh}@mysql:3306/${MYSQL_DATABASE:-oficio}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${LIVEKIT_DOMAIN}}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run ./scripts/gen-secrets.sh}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run ./scripts/gen-secrets.sh}
      LIVEKIT_ROOM: ${LIVEKIT_ROOM:-oficio}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # The app writes nothing outside /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4747/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [internal, web]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    configs:
      - source: livekit_config
        target: /etc/livekit.yaml
    ports:
      # Media ports are published directly on the host (ICE announces the public IP + these ports).
      - "${LIVEKIT_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [internal, web]
    logging: *logging

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-256M}"
      - "--max-connections=100"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run ./scripts/gen-secrets.sh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oficio}
      MYSQL_USER: ${MYSQL_USER:-oficio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [internal]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:?set OFFICE_DOMAIN in .env}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    logging: *logging

configs:
  caddyfile:
    content: |
      {
        email {$ACME_EMAIL}
      }
      {$OFFICE_DOMAIN} {
        encode zstd gzip
        header {
          Strict-Transport-Security "max-age=31536000"
          X-Content-Type-Options "nosniff"
          X-Frame-Options "DENY"
          Referrer-Policy "strict-origin-when-cross-origin"
        }
        reverse_proxy app:4747
      }
      {$LIVEKIT_DOMAIN} {
        reverse_proxy livekit:7880
      }
  livekit_config:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        udp_port: 7882
        # Discover the public IP via STUN (works behind Docker's NAT). Set LIVEKIT_NODE_IP in .env to pin it.
        use_external_ip: true
        node_ip: ${LIVEKIT_NODE_IP:-}
      turn:
        enabled: false
      room:
        auto_create: true
        empty_timeout: 300
        departure_timeout: 20
      logging:
        level: info
        pion_level: error

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  internal:
  web:
