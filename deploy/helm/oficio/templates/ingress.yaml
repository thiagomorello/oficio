{{- if .Values.ingress.enabled }}
{{- $host := required "Set ingress.host when ingress.enabled=true." .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oficio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oficio.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with (include "oficio.ingressAnnotations" (dict "ctx" $ "extra" .Values.ingress.annotations)) }}
  {{- if ne (trim .) "{}" }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ default (printf "%s-tls" (include "oficio.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "oficio.fullname" . }}
                port:
                  name: http
{{- end }}
