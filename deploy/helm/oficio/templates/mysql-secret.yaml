{{- if and .Values.mysql.enabled (not .Values.mysql.auth.existingSecret) }}
{{- $name := include "oficio.mysql.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oficio.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
stringData:
  # Alphanumeric so the password stays URL-safe (the app URL-encodes it anyway, but it also shows up in CLI examples).
  mysql-password: {{ include "oficio.keepSecret" (dict "ctx" $ "secret" $name "key" "mysql-password" "value" .Values.mysql.auth.password "default" (randAlphaNum 32)) | quote }}
  mysql-root-password: {{ include "oficio.keepSecret" (dict "ctx" $ "secret" $name "key" "mysql-root-password" "value" .Values.mysql.auth.rootPassword "default" (randAlphaNum 32)) | quote }}
{{- end }}
