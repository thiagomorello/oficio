{{- if not .Values.secrets.existingSecret }}
{{- $name := include "oficio.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oficio.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
type: Opaque
stringData:
  OFFICE_JWT_SECRET: {{ include "oficio.keepSecret" (dict "ctx" $ "secret" $name "key" "OFFICE_JWT_SECRET" "value" .Values.secrets.jwtSecret "default" (randAlphaNum 64)) | quote }}
  {{- if or .Values.livekit.enabled .Values.livekit.external.url }}
  LIVEKIT_API_KEY: {{ include "oficio.keepSecret" (dict "ctx" $ "secret" $name "key" "LIVEKIT_API_KEY" "value" .Values.secrets.livekitApiKey "default" (printf "API%s" (randAlphaNum 12))) | quote }}
  LIVEKIT_API_SECRET: {{ include "oficio.keepSecret" (dict "ctx" $ "secret" $name "key" "LIVEKIT_API_SECRET" "value" .Values.secrets.livekitApiSecret "default" (randAlphaNum 48)) | quote }}
  {{- end }}
  {{- if .Values.metrics.protect }}
  METRICS_TOKEN: {{ include "oficio.keepSecret" (dict "ctx" $ "secret" $name "key" "METRICS_TOKEN" "value" .Values.secrets.metricsToken "default" (randAlphaNum 48)) | quote }}
  {{- end }}
  {{- with .Values.secrets.sendgridApiKey }}
  SENDGRID_API_KEY: {{ . | quote }}
  {{- end }}
  {{- if include "oficio.mysql.externalUrlMode" . }}
  DATABASE_URL: {{ .Values.mysql.external.databaseUrl | quote }}
  {{- else if and (not .Values.mysql.enabled) (not .Values.mysql.external.existingSecret) }}
  MYSQL_PASSWORD: {{ required "Set mysql.external.password or mysql.external.existingSecret for the external MySQL." .Values.mysql.external.password | quote }}
  {{- end }}
{{- end }}
