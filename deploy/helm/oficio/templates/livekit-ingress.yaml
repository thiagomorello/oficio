{{- if and .Values.livekit.enabled .Values.livekit.ingress.enabled }}
{{- $host := required "Set livekit.ingress.host when livekit.ingress.enabled=true." .Values.livekit.ingress.host }}
# TLS termination for LiveKit signaling (wss://). Media (UDP/TCP) never goes through the Ingress.
# If the host is behind a CDN/proxy, that record must be DNS-only: WebRTC needs the real node IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oficio.livekit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oficio.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit
  {{- with (include "oficio.ingressAnnotations" (dict "ctx" $ "extra" .Values.livekit.ingress.annotations)) }}
  {{- if ne (trim .) "{}" }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- with (default .Values.ingress.className .Values.livekit.ingress.className) }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.livekit.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ default (printf "%s-tls" (include "oficio.livekit.fullname" .)) .Values.livekit.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oficio.livekit.fullname" . }}
                port:
                  name: http
{{- end }}
